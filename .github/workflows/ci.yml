name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref is noise: a quick second commit should not leave two
# matrices competing for the same runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the others — the version that broke is the
      # interesting part of the result.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The install is asserted, not assumed: a dependency missing from the `dev` extra
      # would otherwise only show up as a smaller test suite. This fails at the first step
      # with a clear message instead. `make test-ci` then fails on any skip and on a count
      # below the expected total, so "353 passed, 1 skipped" cannot pass as green.
      - name: Assert the test dependencies are installed
        run: python -c "import fastapi, pdfplumber, pytest, reportlab, ruff"

      - name: Lint
        run: make lint

      - name: Tests (a skip or a shrunken suite fails the build)
        run: make test-ci

      - name: Eval
        run: make eval

  smoke:
    # Not part of the matrix: the demos exercise one interpreter's worth of end-to-end
    # behaviour, and repeating them on 3.10/3.12 buys nothing the suite does not already
    # cover version-by-version.
    name: demo smoke tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `make demo` exits 0 even if the workflow produced an empty answer, so the markers the
      # demo itself prints are asserted as well. A smoke test whose only assertion is "the
      # process exited" would pass on a demo that silently stopped working.
      - name: Warranty demo
        run: |
          set -o pipefail
          make demo | tee /tmp/demo-warranty.log
          grep -qF "ANALYSIS RESULT" /tmp/demo-warranty.log
          grep -qF "Demo complete" /tmp/demo-warranty.log

      - name: Laptop return demo
        run: |
          set -o pipefail
          make demo-laptop | tee /tmp/demo-laptop.log
          grep -qF "LAPTOP RETURN DEMO" /tmp/demo-laptop.log
          grep -qF "Intent:" /tmp/demo-laptop.log
