[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buywise-agent"
version = "0.1.0"
description = "A LangGraph-powered multi-agent RAG assistant for warranty/return decisions — MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core workflow
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.6",

    # File parsing
    "pdfplumber>=0.9.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.10.0",
    "lxml>=4.9.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
pgvector = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "rank-bm25>=0.2.0",
    "langchain-community>=0.2.0",
]
evalextra = [
    "ragas>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    # Test-only: tests/test_parser_robustness.py generates a real PDF fixture. Declared here
    # so a fresh `pip install -e ".[dev]"` can run that suite; without it the module's
    # top-level importorskip turns the whole file into one silent skip.
    "reportlab>=4.0.0",
    # The Streamlit UI (`make ui`). It lives in dev rather than a separate extra so the one
    # install command the README documents is enough to run everything. The UI tests do not
    # import it — they exercise apps/ui/uploads.py, which is plain functions — so a
    # streamlit problem can never turn them into a silent skip.
    "streamlit>=1.30.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "ingestion*", "retrieval*", "eval*", "workers*", "apps*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# seed_sample_data.py builds the sample corpus from triple-quoted blocks; its long
# lines are email bodies and HTML markup. Wrapping them would insert newlines into
# the generated files and change what the parsers receive.
"scripts/seed_sample_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
