services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./agent:/app/agent
      - ./ingestion:/app/ingestion
      - ./retrieval:/app/retrieval
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  # NOTE: `worker` (Celery) and `web` (frontend) are Roadmap Phase 6 / Phase 7 items
  # and are intentionally NOT defined here — this MVP ships API + CLI only.
  # Re-adding `worker` requires workers/celery_app.py to exist.
  # Re-adding `web` requires apps/web/ to contain an actual index.html.

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: buywise
      POSTGRES_USER: buywise
      POSTGRES_PASSWORD: buywise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buywise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
